<div class="modal-header">
  <h4 class="modal-title">{{ 'admin.common.confirmDeleteTitle' | translate }}</h4>
  <button type="button" class="btn-close" aria-label="Close" (click)="dismiss()"></button>
</div>

<div class="modal-body">
  <p>{{ 'admin.news.delete.confirm' | translate: { title: post.title } }}</p>
  <p class="text-danger">{{ 'admin.common.cannotBeUndone' | translate }}</p>

  <div *ngIf="error" class="alert alert-danger mt-3">
    {{ error }}
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="dismiss()">{{ 'admin.common.cancel' | translate }}</button>
  <button
    type="button"
    class="btn btn-danger"
    (click)="confirmDelete()"
    [disabled]="deleting"
  >
    <span *ngIf="deleting" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
    {{ 'admin.common.delete' | translate }}
  </button>
</div>
