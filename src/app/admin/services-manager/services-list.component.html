<div class="services-list-container">
  <div class="header-actions">
    <h2 class="section-title">Gestión de Servicios</h2>
    <a routerLink="nuevo" class="btn btn-primary">
      <i class="bi bi-plus-circle me-2"></i>
      Nuevo Servicio
    </a>
  </div>
  
  <div class="card">
    <div class="card-body">
      <div class="search-box mb-4">
        <div class="input-group">
          <span class="input-group-text">
            <i class="bi bi-search"></i>
          </span>
          <input 
            type="text" 
            class="form-control" 
            placeholder="Buscar por nombre..." 
            [(ngModel)]="searchTerm"
            (input)="search()"
          >
        </div>
      </div>
      
      <div *ngIf="loading" class="loading-spinner">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
      </div>
      
      <div *ngIf="!loading" class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Slug</th>
              <th>Estado</th>
              <th>Orden</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let service of filteredServices">
              <td>{{ service.id }}</td>
              <td>{{ service.name }}</td>
              <td>{{ service.slug }}</td>
              <td>
                <span class="badge bg-success" *ngIf="service.is_active">Activo</span>
                <span class="badge bg-secondary" *ngIf="!service.is_active">Inactivo</span>
              </td>
              <td>{{ service.sort_order }}</td>
              <td>
                <div class="action-buttons">
                  <a [routerLink]="[service.id]" class="btn btn-sm btn-outline-primary me-2">
                    <i class="bi bi-pencil"></i>
                  </a>
                  <button class="btn btn-sm btn-outline-danger" (click)="openDeleteModal(service)">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
            <tr *ngIf="filteredServices.length === 0">
              <td colspan="6" class="text-center">No se encontraron servicios</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
