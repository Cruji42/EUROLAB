<div class="login-container">
  <div class="login-card">
    <div class="text-center mb-4">
      <img src="assets/img/logo/laboratorio-euronutec-dark.png" alt="">
      <h5 class="mt-3">Recuperar contraseña</h5>
    </div>

    <ng-container *ngIf="!success; else successTpl">
      <p class="text-muted text-center mb-4" style="font-size:14px;">
        Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
      </p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
            type="email"
            formControlName="email"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['email'].errors }"
            id="email"
            placeholder="correo@ejemplo.com"
          >
          <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
            <div *ngIf="f['email'].errors['required']">El correo es requerido</div>
            <div *ngIf="f['email'].errors['email']">Ingrese un correo válido</div>
          </div>
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="text-white theme-bg-3" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            Enviar enlace
          </button>
        </div>
      </form>
    </ng-container>

    <ng-template #successTpl>
      <div class="alert alert-success text-center">
        Revisa tu correo. Si existe una cuenta con ese email, recibirás un enlace para restablecer tu contraseña.
      </div>
    </ng-template>

    <div class="text-center mt-2">
      <a routerLink="/login" class="text-muted" style="font-size:14px;">← Volver al inicio de sesión</a>
    </div>
  </div>
</div>
