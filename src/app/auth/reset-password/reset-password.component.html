<div class="login-container">
  <div class="login-card">
    <div class="text-center mb-4">
      <img src="assets/img/logo/laboratorio-euronutec-dark.png" alt="">
      <h5 class="mt-3">Nueva contraseña</h5>
    </div>

    <ng-container *ngIf="!success; else successTpl">
      <div class="alert alert-danger" *ngIf="error && !token">{{ error }}</div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="token">
        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

        <div class="mb-3">
          <label for="password" class="form-label">Nueva contraseña</label>
          <input
            type="password"
            formControlName="password"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
            id="password"
          >
          <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
            <div *ngIf="f['password'].errors['required']">La contraseña es requerida</div>
            <div *ngIf="f['password'].errors['minlength']">Mínimo 8 caracteres</div>
          </div>
        </div>

        <div class="mb-4">
          <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
          <input
            type="password"
            formControlName="confirmPassword"
            class="form-control"
            [ngClass]="{ 'is-invalid': submitted && (f['confirmPassword'].errors || form.errors?.['passwordMismatch']) }"
            id="confirmPassword"
          >
          <div *ngIf="submitted && (f['confirmPassword'].errors || form.errors?.['passwordMismatch'])" class="invalid-feedback">
            <div *ngIf="f['confirmPassword'].errors?.['required']">Confirma tu contraseña</div>
            <div *ngIf="form.errors?.['passwordMismatch']">Las contraseñas no coinciden</div>
          </div>
        </div>

        <div class="d-grid mb-3">
          <button type="submit" class="text-white theme-bg-3" [disabled]="loading">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
            Restablecer contraseña
          </button>
        </div>
      </form>
    </ng-container>

    <ng-template #successTpl>
      <div class="alert alert-success text-center">
        Contraseña restablecida correctamente. Serás redirigido al inicio de sesión en unos segundos...
      </div>
    </ng-template>

    <div class="text-center mt-2">
      <a routerLink="/login" class="text-muted" style="font-size:14px;">← Volver al inicio de sesión</a>
    </div>
  </div>
</div>
