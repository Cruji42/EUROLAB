<div class="login-container">
  <div class="login-card">
    <div class="text-center mb-4">
      <img src="assets/img/logo/laboratorio-euronutec-dark.png" [alt]="'auth.login.logoAlt' | translate">

      <h5 class="mt-3">{{ 'auth.login.title' | translate }}</h5>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="alert alert-danger" *ngIf="error">
        {{ error }}
      </div>

      <div class="mb-3">
        <label for="username" class="form-label">{{ 'auth.login.emailLabel' | translate }}</label>
        <input
          type="email"
          formControlName="username"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['username'].errors }"
          id="username"
          [placeholder]="'auth.login.emailPlaceholder' | translate"
        >
        <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">
          <div *ngIf="f['username'].errors['required']">{{ 'auth.login.emailRequired' | translate }}</div>
          <div *ngIf="f['username'].errors['email']">{{ 'auth.login.emailInvalid' | translate }}</div>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">{{ 'auth.login.passwordLabel' | translate }}</label>
        <input
          type="password"
          formControlName="password"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
          id="password"
        >
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <div *ngIf="f['password'].errors['required']">{{ 'auth.login.passwordRequired' | translate }}</div>
        </div>
      </div>

      <div class="d-grid">
        <button
          type="submit"
          class="text-white theme-bg-3"
          [disabled]="loading"
        >
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-1"></span>
          {{ 'auth.login.submit' | translate }}
        </button>
      </div>

      <div class="text-center mt-3">
        <a routerLink="/forgot-password" class="text-muted" style="font-size:14px;">{{ 'auth.login.forgotPasswordLink' | translate }}</a>
      </div>
    </form>
  </div>
</div>
