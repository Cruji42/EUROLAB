
<section class="ca-working-section theme-black-bg-3 pt-390 pb-70">
    <div class="container">
      <div class="ca-working-section-3 ca-sec-content-3 text-center mb-60" data-aos="fade-up" data-aos-duration="800">
        <h5 class="ca-section-subtitle subtitle-bg-7 p-relative text-white br-50">{{ 'home.working1.subtitle' | translate }}</h5>
        <h2 class="ca-section-title theme-black-3 fnw-600 text-white pt-16">{{ 'home.working1.title' | translate }}</h2>
        <p class="pt-16">{{ 'home.working1.description' | translate }}</p>
      </div>
      <div class="row">

        @for (process of workingProcess; track $index) {
        <div class="col-xl-3 col-lg-4 col-md-6 mb-30">
          <div class="ca-work-ic-box br-7" data-aos="fade-up" data-aos-duration="800">
            <div class="ca-work-ic-box-img">
              <span>
                <img [src]="process.icon" alt="">
              </span>
            </div>
            <div class="ca-work-ic-box-content">
              <h4 class="ca-title fnw-600 text-white pt-24 pb-16"><a [routerLink]="['/' + process.link]">{{ process.title | translate }}</a></h4>
              <ul [innerHTML]="process.description | translate" class="text-white"></ul>
            </div>
          </div>
        </div>
    }
      </div>
    </div>
  </section>
