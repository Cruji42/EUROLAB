<ngx-slick-carousel class="ca-slider-active-3" [config]="sliderConfig">
  <div *ngFor="let slide of slides" ngxSlickItem class="ca-slider-3 cream-bg-3 p-relative z-index-1 fix">

    <div class="ca-slider-3-shape d-none d-lg-block">
      <img src="assets/img/shape/ca-shape3.3.png" alt="">
      <div class="ca-slider-top-shape-img">
        <img src="assets/img/shape/ca-image-shape3.3.png" alt="">
      </div>
    </div>

    <div class="ca-slider-img-3 p-absolute">
      <img [src]="slide.image_url" alt="">
    </div>

    <div class="ca-line-shape3">
      <img src="assets/img/shape/ca-shape3.1.png" alt="">
    </div>

    <div class="ca-overlay-shape3 p-absolute">
      <img src="assets/img/shape/overlay-shape3.2.png" alt="">
    </div>

    <div class="container">
      <div class="row">
        <div class="col-lg-6 col-md-10">
          <div class="ca-hero-content-3">
            <h6 class="ca-section-subtitle subtitle-bg-6 p-relative theme-color-3 br-50">{{ slide.subtitle }}</h6>
            <h1 class="ca-slider-heading theme-black-3 fnw-600 pt-20 pb-20">{{ slide.title }}</h1>
            <p class="pt-16 pb-32">{{ slide.description }}</p>
            <div class="hero3-btn">
              <a [routerLink]="slide.btn_primary_link" class="ca-btn-primary-3 theme-bg-3 text-white br-50">
                {{ slide.btn_primary_text }}<span><i class="fa-solid fa-angle-right"></i></span>
              </a>
              <a *ngIf="slide.btn_secondary_text" [routerLink]="slide.btn_secondary_link"
                 class="ca-sec-primary-3 theme-color-3 br-50">
                {{ slide.btn_secondary_text }}<span><i class="fa-solid fa-angle-right"></i></span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</ngx-slick-carousel>
