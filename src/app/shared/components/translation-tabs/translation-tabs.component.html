<div class="translation-tabs" role="tablist">
  <button type="button"
          *ngFor="let l of langs"
          role="tab"
          class="translation-tab"
          [class.active]="l.code === active"
          [attr.aria-selected]="l.code === active"
          (click)="select(l.code)">
    {{ l.label }}
  </button>
</div>
